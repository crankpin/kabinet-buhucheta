<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <!-- Премиальный чат -->
  
  <defs>
    <linearGradient id="chatGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bubbleGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ecf0f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bdc3c7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Тень -->
  <ellipse cx="32" cy="58" rx="22" ry="3" fill="#1a202c" opacity="0.15"/>
  
  <!-- Основной пузырь -->
  <path d="M12 16 C12 12, 16 8, 20 8 L44 8 C48 8, 52 12, 52 16 L52 36 C52 40, 48 44, 44 44 L28 44 L18 52 L20 44 C16 44, 12 40, 12 36 Z" 
        fill="url(#chatGradient)" 
        stroke="#1a202c" 
        stroke-width="1.5"/>
  
  <!-- Хвостик пузыря -->
  <path d="M18 44 L12 50 L16 46 Z" fill="url(#chatGradient)" stroke="#1a202c" stroke-width="1.5"/>
  
  <!-- Внутренний пузырь сообщения -->
  <rect x="18" y="14" width="28" height="24" rx="3" fill="url(#bubbleGradient)" stroke="#34495e" stroke-width="1" opacity="0.9"/>
  
  <!-- Линии текста -->
  <line x1="22" y1="20" x2="40" y2="20" stroke="#34495e" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="22" y1="26" x2="38" y2="26" stroke="#34495e" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="22" y1="32" x2="36" y2="32" stroke="#34495e" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Блеск -->
  <path d="M16 12 L22 12 Q24 14 22 16 L16 16 Z" fill="#ffffff" opacity="0.3"/>
</svg>
