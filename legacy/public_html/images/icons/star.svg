<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <!-- Премиальная звезда -->
  
  <defs>
    <linearGradient id="starGradient" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Тень -->
  <ellipse cx="32" cy="58" rx="16" ry="2" fill="#1a202c" opacity="0.2"/>
  
  <!-- Звезда -->
  <path d="M32 8 L36 24 L52 24 L40 34 L44 50 L32 40 L20 50 L24 34 L12 24 L28 24 Z" 
        fill="url(#starGradient)" 
        stroke="#FF8C00" 
        stroke-width="1.5" 
        filter="url(#glow)"/>
  
  <!-- Внутренний блеск -->
  <path d="M32 16 L34 26 L42 26 L36 32 L38 40 L32 34 L26 40 L28 32 L22 26 L30 26 Z" 
        fill="#ffffff" 
        opacity="0.4"/>
</svg>
